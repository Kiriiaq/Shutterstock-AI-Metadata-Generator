[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shutterstock-ai-metadata-generator"
version = "1.0.1"
description = "AI-powered metadata generator for Shutterstock images with Ollama integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Kiriiaq"}]

dependencies = [
    "customtkinter>=5.2.0,<6.0.0",
    "CTkToolTip>=0.8,<1.0",
    "Pillow>=10.0.0,<12.0.0",
    "piexif>=1.1.3,<2.0.0",
    "ollama>=0.1.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "urllib3>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
shutterstock-analyzer = "shutterstock_ai_v2.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "shutterstock_ai_v2*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.ico", "*.png", "*.jpg", "*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
