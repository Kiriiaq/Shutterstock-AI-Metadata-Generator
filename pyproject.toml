[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shutterstock-ai-metadata-generator"
version = "2.2.0"
description = "AI-powered metadata generator for Shutterstock images with Ollama integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Emmanuel Grolleau"}]

dependencies = [
    # Active runtime deps only — verified used in src/. The previous list
    # (CTkToolTip, piexif, ollama, pydantic) was inherited from v1 but
    # never imported by v2 source.
    "customtkinter>=5.2.0,<6.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "requests>=2.31.0,<3.0.0",
    "urllib3>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.0.0",
]

# Entry points: run `python main.py` from source, or use the bundled
# ShutterstockAnalyzer.exe produced by `python build.py release`.

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.ico", "*.png", "*.jpg", "*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
