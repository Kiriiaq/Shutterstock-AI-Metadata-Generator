name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      # Without this step the EXE falls back to DEFAULT_DEV_SECRET, which is
      # readable in this public repo: Pro licences would be forgeable.
      - name: Embed license secret
        shell: bash
        env:
          SSA_LICENSE_SECRET: ${{ secrets.SSA_LICENSE_SECRET }}
        run: |
          if [ -z "$SSA_LICENSE_SECRET" ]; then
            echo "::error::SSA_LICENSE_SECRET is not configured in repository secrets."
            exit 1
          fi
          python - <<'PY'
          import os, pathlib
          target = pathlib.Path("src/modules/licensing/_secret_compiled.py")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              '"""Generated at build time. Never commit."""\n'
              f'PROD_SECRET = {os.environ["SSA_LICENSE_SECRET"]!r}\n',
              encoding="utf-8",
          )
          print("license secret embedded")
          PY
      - name: Build Release executable
        shell: cmd
        run: |
          pyinstaller --onefile --noconsole ^
            --name "shutterstock-ai-%VERSION%-windows-release" ^
            --icon "assets/icons/icone.ico" ^
            --add-data "assets;assets" ^
            --hidden-import customtkinter ^
            --hidden-import PIL._tkinter_finder ^
            --hidden-import ollama ^
            --hidden-import pydantic ^
            --hidden-import piexif ^
            --hidden-import CTkToolTip ^
            --exclude-module matplotlib ^
            --exclude-module scipy ^
            --exclude-module jupyter ^
            --exclude-module pytest ^
            main.py
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
      - name: Build Debug executable
        shell: cmd
        run: |
          pyinstaller --onefile --console --debug=all ^
            --name "shutterstock-ai-%VERSION%-windows-debug" ^
            --icon "assets/icons/icone.ico" ^
            --add-data "assets;assets" ^
            --hidden-import customtkinter ^
            --hidden-import PIL._tkinter_finder ^
            --hidden-import ollama ^
            --hidden-import pydantic ^
            --hidden-import piexif ^
            --hidden-import CTkToolTip ^
            --exclude-module matplotlib ^
            --exclude-module scipy ^
            --exclude-module jupyter ^
            --exclude-module pytest ^
            main.py
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          SHUTTERSTOCK_DEBUG: "1"
      - name: Remove embedded secret from workspace
        if: always()
        shell: bash
        run: rm -f src/modules/licensing/_secret_compiled.py
      - name: Generate checksums
        shell: bash
        run: cd dist && sha256sum *.exe > checksums-sha256.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shutterstock-ai-${{ steps.version.outputs.VERSION }}-windows
          path: |
            dist/*.exe
            dist/checksums-sha256.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "StockMeta Pro ${{ github.ref_name }}"
          body: |
            ## StockMeta Pro ${{ github.ref_name }}

            ### Downloads
            - **Release**: `StockMetaPro.exe`
            - **Debug**: `StockMetaPro-debug.exe`

            Download the Release `.exe` and run it. No installation required.

            ---
            [Changelog](https://github.com/Kiriiaq/StockMeta/blob/main/CHANGELOG.md) | [Ko-fi](https://ko-fi.com/Kiriiaq)
          files: |
            dist/*.exe
            dist/checksums-sha256.txt
